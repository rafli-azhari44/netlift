version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed','cancelled','refunded','processing']

  - name: fct_ab_users
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: variant
        tests:
          - accepted_values:
              values: ['A','B']

  - name: dim_sku
    columns:
      - name: sku_code
        tests: [unique, not_null]
